name: Preview screenshots (temporary)
on:
  push:
    branches: ["redesign/**"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://hanszoe.com
          PUBLIC_INDEXABLE: "true"
      - run: npx playwright install --with-deps chromium
      - name: Screenshot
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 &
          npx wait-on -t 60000 http://127.0.0.1:4321/ || sleep 15
          mkdir -p out
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [name, w] of [['desktop', 1440], ['tablet', 900], ['mobile', 375]]) {
            const p = await b.newPage({ viewport: { width: w, height: 900 } });
            await p.goto('http://127.0.0.1:4321/merch/nendoroid-hange-1123/', { waitUntil: 'networkidle' });
            await p.screenshot({ path: `out/${name}.png`, fullPage: true });
            await p.locator('.pd-data summary').click();
            await p.locator('.pd-data').screenshot({ path: `out/${name}-data-open.png` });
            const overflow = await p.evaluate(() => document.documentElement.scrollWidth > innerWidth);
            console.log(name, 'overflow', overflow);
            await p.close();
          }
          const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
          await p.goto('http://127.0.0.1:4321/merch/lookup-hange/', { waitUntil: 'networkidle' });
          await p.screenshot({ path: 'out/other-product-unchanged.png', fullPage: true });
          await b.close();
          EOF
          node shot.mjs
          cp dist/merch/nendoroid-hange-1123/index.html out/page.html
      - name: Push screenshots
        run: |
          cd out
          git init -q -b preview-shots
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "preview ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-shots
